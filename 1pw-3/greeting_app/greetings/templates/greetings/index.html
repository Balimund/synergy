{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приветствие</title>
  <link rel="stylesheet" href="{% static 'greetings/style.css' %}">
</head>
<body>
  <main class="card">
    {% if last_user %}
      <h1>Привет, {{ last_user.name }}!</h1>
    {% else %}
      <h1>Привет! Как вас зовут?</h1>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.name }}
      {% if form.name.errors %}
        <ul class="errors">
          {% for error in form.name.errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      {% endif %}
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
