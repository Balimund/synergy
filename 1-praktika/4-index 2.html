<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .calculator {
      width: 90%;
      max-width: 400px;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 24px;
      color: #333;
    }

    input {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      padding: 12px;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #43cea2, #185a9d);
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      min-height: 52px;
      padding: 14px;
      text-align: center;
      font-size: 20px;
      color: #222;
      background: #f0f0f5;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #result.error {
      color: #d32f2f;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>Калькулятор</h1>

    <input type="text" id="a" placeholder="Первое число" autocomplete="off">
    <input type="text" id="b" placeholder="Второе число" autocomplete="off">

    <div class="buttons">
      <button id="sum">сумма</button>
      <button id="diff">разность</button>
      <button id="mul">произведение</button>
      <button id="div">деление</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    const inputA = document.getElementById("a");
    const inputB = document.getElementById("b");
    const resultEl = document.getElementById("result");

    // Четыре функции математических действий
    function sum(x, y) {
      return x + y;
    }

    function difference(x, y) {
      return x - y;
    }

    function product(x, y) {
      return x * y;
    }

    function divide(x, y) {
      return x / y;
    }

    // Преобразует строку в число; возвращает null, если это не число
    function parseNumber(value) {
      const text = value.trim().replace(",", ".");
      if (text === "" || isNaN(Number(text))) {
        return null;
      }
      return Number(text);
    }

    function showResult(text, isError) {
      resultEl.textContent = text;
      resultEl.classList.toggle("error", isError);
    }

    function calculate(operation) {
      const x = parseNumber(inputA.value);
      const y = parseNumber(inputB.value);

      if (x === null || y === null) {
        showResult("Ошибка: введите в оба поля числа", true);
        return;
      }

      if (operation === divide && y === 0) {
        showResult("Ошибка: на ноль делить нельзя", true);
        return;
      }

      // Округляем, чтобы убрать хвосты вида 0.1 + 0.2 = 0.30000000000000004
      const value = Math.round(operation(x, y) * 1e10) / 1e10;
      showResult(value, false);
    }

    document.getElementById("sum").addEventListener("click", function () {
      calculate(sum);
    });
    document.getElementById("diff").addEventListener("click", function () {
      calculate(difference);
    });
    document.getElementById("mul").addEventListener("click", function () {
      calculate(product);
    });
    document.getElementById("div").addEventListener("click", function () {
      calculate(divide);
    });
  </script>
</body>
</html>
